<header class="header" [class.header--dark]="layout.darkHeader()">
  <div class="container header__inner">
    <a class="header__brand" routerLink="/">
      <span class="header__logo"><app-icon name="pin" [size]="18" [strokeWidth]="2.4" /></span>
      <span>{{ 'APP.TITLE' | translate }}</span>
    </a>

    <nav class="header__nav" [attr.aria-label]="'NAV.LABEL' | translate">
      <a
        class="header__link"
        routerLink="/"
        routerLinkActive="header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >{{ 'NAV.HOME' | translate }}</a
      >
      <a class="header__link" routerLink="/search" routerLinkActive="header__link--active">
        {{ 'NAV.SEARCH' | translate }}
      </a>
    </nav>

    <div class="header__languages" role="group" [attr.aria-label]="'APP.LANGUAGE' | translate">
      @for (language of languages; track language) {
        <button
          type="button"
          class="header__language"
          [class.header__language--active]="translation.language() === language"
          [attr.aria-pressed]="translation.language() === language"
          (click)="changeLanguage(language)"
        >
          {{ language.toUpperCase() }}
        </button>
      }
    </div>
  </div>
</header>
