<div class="stats">
  @for (tile of tiles; track tile.key; let first = $first) {
    <button
      type="button"
      class="stats__tile"
      [class.stats__tile--total]="first"
      [class.stats__tile--active]="isActive(tile)"
      [attr.aria-pressed]="isActive(tile)"
      (click)="applyFilter.emit(tile.patch)"
    >
      <span class="stats__icon"><app-icon [name]="tile.icon" [size]="18" /></span>
      <span class="stats__value">{{ stats()[tile.key] }}</span>
      <span class="stats__label">{{ tile.label | translate }}</span>
      @if (!first) {
        <span class="stats__bar"><span [style.width.%]="share(tile)"></span></span>
      }
    </button>
  }
</div>
