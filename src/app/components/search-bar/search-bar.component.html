<form class="card search" (ngSubmit)="submit()">
  <div class="search__row">
    <label class="field search__locality">
      <span class="field__label">{{ 'SEARCH.LOCALITY_LABEL' | translate }}</span>
      <span class="search__input">
        <app-icon name="pin" [size]="18" />
        <input
          class="field__control"
          name="locality"
          type="text"
          autocomplete="off"
          required
          [placeholder]="'SEARCH.LOCALITY_PLACEHOLDER' | translate"
          [ngModel]="locality()"
          (ngModelChange)="locality.set($event)"
        />
      </span>
    </label>

    <!-- Free-text sector: replaces the categories when filled -->
    <label class="field search__sector">
      <span class="field__label">{{ 'SEARCH.SECTOR_LABEL' | translate }}</span>
      <span class="search__input">
        <app-icon name="store" [size]="18" />
        <input
          class="field__control"
          name="sector"
          type="text"
          autocomplete="off"
          list="sector-suggestions"
          maxlength="60"
          [placeholder]="'SEARCH.SECTOR_PLACEHOLDER' | translate"
          [ngModel]="sector()"
          (ngModelChange)="sector.set($event)"
        />
        @if (sector()) {
          <button
            type="button"
            class="search__clear"
            [attr.aria-label]="'SEARCH.SECTOR_CLEAR' | translate"
            (click)="sector.set('')"
          >
            <app-icon name="x" [size]="14" />
          </button>
        }
      </span>
      <datalist id="sector-suggestions">
        @for (id of sectorIds; track id) {
          <option [value]="'SECTORS.' + id.toUpperCase() | translate"></option>
        }
      </datalist>
    </label>

    <label class="field">
      <span class="field__label">{{ 'SEARCH.RADIUS_LABEL' | translate }}</span>
      <select
        class="field__control"
        name="radius"
        [ngModel]="radiusKm()"
        (ngModelChange)="radiusKm.set(+$event)"
      >
        @for (radius of radiusOptions; track radius) {
          <option [ngValue]="radius">{{ radius }} km</option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">{{ 'SEARCH.SOURCE_LABEL' | translate }}</span>
      <select
        class="field__control"
        name="source"
        [ngModel]="source()"
        (ngModelChange)="source.set($event)"
      >
        @for (item of sources(); track item) {
          <option [ngValue]="item">{{ 'SOURCES.' + item.toUpperCase() | translate }}</option>
        }
      </select>
    </label>

    <button
      class="button button--primary button--large search__submit"
      type="submit"
      [disabled]="loading() || !canSubmit()"
    >
      @if (loading()) {
        <app-loader size="small" message="SEARCH.SEARCHING" />
      } @else {
        <app-icon name="search" [size]="18" /> {{ 'SEARCH.BUTTON' | translate }}
      }
    </button>
  </div>

  <fieldset
    class="search__categories"
    [disabled]="!!sector().trim()"
    [class.is-muted]="!!sector().trim()"
  >
    <legend class="search__legend">
      <span class="field__label">{{ 'SEARCH.CATEGORIES_LABEL' | translate }}</span>
      <button type="button" class="link-button" (click)="toggleAllCategories()">
        {{
          (categories().length === allCategories.length ? 'SEARCH.CLEAR_ALL' : 'SEARCH.SELECT_ALL')
            | translate
        }}
      </button>
    </legend>
    @if (sector().trim()) {
      <p class="search__note">
        <app-icon name="filter" [size]="14" />
        {{ 'SEARCH.SECTOR_OVERRIDES' | translate: { sector: sector().trim() } }}
      </p>
    }
    @for (category of allCategories; track category) {
      <button
        type="button"
        class="chip"
        [class.chip--active]="categories().includes(category)"
        [attr.aria-pressed]="categories().includes(category)"
        (click)="toggleCategory(category)"
      >
        @if (categories().includes(category)) {
          <app-icon name="check" [size]="14" [strokeWidth]="2.6" />
        }
        {{ 'CATEGORIES.' + category.toUpperCase() | translate }}
      </button>
    }
  </fieldset>
</form>
